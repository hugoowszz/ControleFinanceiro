<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="configuracoes.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">

    <title>Meu Perfil e Configurações - Porkito</title>
</head>
<body>
    <header>
        <div class="header-logo">
            <img src="../../src/icon.png" alt="Porkito Icon" class="icon-header">
            <h2>Porkito</h2>
        </div>
        <i class="fa-regular fa-bell bell-icon"></i>
    </header>

    <main>
        <!-- SEÇÃO DO PERFIL -->
        <div class="perfil-topo">
            <div class="avatar-container">
                <div class="avatar-img-placeholder">
                    <i class="fa-solid fa-user avatar-icon"></i>
                </div>
            </div>
            <h2 class="nome-usuario" id="perfilNome">Carregando...</h2>
            <p id="perfilEmail" style="color: #94A3B8; font-size: 13px; margin-top: 4px;">seu@email.com</p>
        </div>

        <!-- LISTA DE CONFIGURAÇÕES -->
        <div class="lista-opcoes">
            <div class="opcao-card">
                <div class="opcao-esquerda">
                    <div class="opcao-icone">
                        <i class="fa-solid fa-user-gear"></i>
                    </div>
                    <div class="opcao-info">
                        <h3>Configurações da Conta</h3>
                        <span>Atualizar dados pessoais e preferências</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right chevron-icon"></i>
            </div>

            <div class="opcao-card">
                <div class="opcao-esquerda">
                    <div class="opcao-icone">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <div class="opcao-info">
                        <h3>Segurança</h3>
                        <span>Autenticação JWT ativa e protegida</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right chevron-icon"></i>
            </div>
        </div>

        <!-- BOTÃO SAIR -->
        <button class="btn-sair" onclick="encerrarSessao()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            Encerrar Sessão
        </button>
    </main>

    <!-- BARRA DE NAVEGAÇÃO -->
    <div class="barra-navegacao">
        <div onclick="window.location.href='../../index.html'">
            <i class="fa-solid fa-building-columns"></i>
            <span>Dashboard</span>
        </div>
        <div onclick="window.location.href='../transacoes/transacoes.html'">
            <i class="fa-solid fa-receipt"></i>
            <span>Transações</span>
        </div>
        <div onclick="window.location.href='../relatorios/relatorios.html'">
            <i class="fa-solid fa-piggy-bank"></i>
            <span>Relatórios</span>
        </div>
        <div class="active" onclick="window.location.href='./configuracoes.html'">
            <i class="fa-solid fa-user-gear"></i>
            <span>Configurações</span>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="../../api.js"></script>
    <script>
        verificarAutenticacao();

        const usuario = getUsuarioLogado();
        if (usuario) {
            document.getElementById('perfilNome').innerText = usuario.nome || 'Usuário';
            document.getElementById('perfilEmail').innerText = usuario.email || '';
        }
    </script>
</body>
</html>
